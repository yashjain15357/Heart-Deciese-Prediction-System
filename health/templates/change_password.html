{% extends 'index.html' %}
{% load static %}
{% block body %}
{% if terror == "yes" %}
<script>
    alert('Password Successfully Changed');
    window.location="{% url 'logout' %}";
</script>
{% endif %}
{% if terror == "not" %}
<script>
    alert('Password does not match');
</script>
{% endif %}

	<section class="contact py-5" id="contact">
		<div class="container py-xl-5 py-lg-3">
			<div class="title-section mb-md-5 mb-4">
				<h3 class="w3ls-title text-uppercase text-dark font-weight-bold">Change Password</h3>
			</div>
			<div class="row contact-block no-gutters">
				<div class="col-lg-12 contact-right"> 
					<form action="" method="post">
						{% csrf_token %}
						<div class="form-row">
							<div class="form-group col-md-6">
								<label>New Password</label>
								<input type="password" class="form-control" name="pwd1" placeholder="Enter New Password" required="">
							</div>
							<div class="form-group col-md-6">
								<label>Confirm Password</label>
								<input type="password" class="form-control" name="pwd2" placeholder="Confirm Password" required="">
							</div>
						</div>
						<div class="form-group">
							<label>Old Password</label>
							<input type="password" class="form-control" name="pwd3" placeholder="Old Password" required="">
						</div>
						<button type="submit" class="btn submit mt-4" style="background-color: #61bbb9;">Update</button>
					</form>
				</div>
			</div>
		</div>
	</section>
{% endblock %}
